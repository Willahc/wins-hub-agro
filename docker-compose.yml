# Compose v2 (docker compose). `mem_limit` continua honrado fora de swarm.
# ATENÇÃO: o compose v2 interpola `${}` nos valores do env_file. O hash bcrypt
# (MARI_PASSWORD_HASH) tem `$`, então no .env ele está escapado como `$$` — o
# compose desexpande `$$`->`$` ao injetar. Se regerar o hash, dobre cada `$`.

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    mem_limit: 2g
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Apenas localhost — não exposto à internet. api acessa via rede interna (db:5432).
      - "127.0.0.1:5432:5432"

  api:
    build: ./app
    restart: always
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    # 1.5g: o export CSV nacional (200k leads) materializa as linhas em memória
    mem_limit: 1536m
    depends_on:
      - db
    expose:
      - "8000"

  nginx:
    # pinada na minor da imagem em produção (1.31.x) — :alpine puro flutua de major
    image: nginx:1.31-alpine
    restart: always
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - api

  certbot:
    # pinada na versão em produção — :latest flutua
    image: certbot/certbot:v5.6.0
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
