# Compose v2 (docker compose). `mem_limit` continua honrado fora de swarm.
# ATENÇÃO: o compose v2 interpola `${}` nos valores do env_file. O hash bcrypt
# (MARI_PASSWORD_HASH) tem `$`, então no .env ele está escapado como `$$` — o
# compose desexpande `$$`->`$` ao injetar. Se regerar o hash, dobre cada `$`.

# Rotação de log (json-file ilimitado por padrão = risco de encher disco):
# 10MB x 5 arquivos por container. Aplicado em todos os serviços via âncora.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    mem_limit: 2g
    logging: *default-logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Apenas localhost — não exposto à internet. api acessa via rede interna (db:5432).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wins_agro || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: ./app
    restart: always
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    # 1.5g: o export CSV nacional (200k leads) materializa as linhas em memória
    mem_limit: 1536m
    logging: *default-logging
    # espera o db ficar SAUDÁVEL (não só "criado") — evita falha de query no boot frio
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # liveness do processo (rota pública /healthz, sem PII, sem tocar o DB)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=3).getcode()==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    # pinada na minor da imagem em produção (1.31.x) — :alpine puro flutua de major
    image: nginx:1.31-alpine
    restart: always
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./ci:/var/www/ci
      # Prospecção privada (servida em /prospec/, atrás de Basic Auth) — read-only
      - ./prospeccao-campanella:/var/www/prospec:ro
      - ./nginx/.htpasswd_prospec:/etc/nginx/.htpasswd_prospec:ro
    depends_on:
      - api

  certbot:
    # pinada na versão em produção — :latest flutua
    image: certbot/certbot:v5.6.0
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  pgdata:
