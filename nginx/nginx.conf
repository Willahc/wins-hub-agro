limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=simulador:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=csvexp:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=ciapi:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name winshubagro.cloud www.winshubagro.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name winshubagro.cloud www.winshubagro.cloud;
    ssl_certificate /etc/letsencrypt/live/winshubagro.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winshubagro.cloud/privkey.pem;
    client_max_body_size 12m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/manifest+json image/svg+xml;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /login { limit_req zone=login burst=8 nodelay; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /api/simulador/proposta { limit_req zone=simulador burst=5 nodelay; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /api/leads/csv { limit_req zone=csvexp burst=3 nodelay; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/ { limit_req zone=api burst=60 nodelay; proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

server {
    listen 80;
    listen [::]:80;
    server_name ci.winshubagro.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ci.winshubagro.cloud;
    ssl_certificate /etc/letsencrypt/live/ci.winshubagro.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.winshubagro.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 5; gzip_min_length 256;
    gzip_types text/plain text/css application/javascript text/javascript image/svg+xml;
    # CSP sem CDN externo (libs agora são self-hosted em /libs). Mantém 'unsafe-eval'
    # (jsPDF/Chart) e 'unsafe-inline' (handlers inline + <script> inline do app).
    set $ci_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://nominatim.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org https://wa.me; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self';";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $ci_csp always;
    root /var/www/ci;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    # Backend do Cliente Inteligente (Fase 2): contas, backup cifrado, publicar cardápio.
    location /api/ {
        limit_req zone=ciapi burst=20 nodelay;
        client_max_body_size 8m;
        proxy_pass http://ci-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Cardápios públicos publicados pelos lojistas (estáticos; pedido do cliente via wa.me).
    # ^~ evita o regex \.html$ (que tem root /var/www/ci). Headers próprios + CSP enxuta.
    location ^~ /loja/ {
        alias /var/www/lojas/;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
    # Libs versionadas e imutáveis: cache longo (visitas repetidas / fora do PWA).
    location ^~ /libs/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # HTML nunca cacheia. add_header local SUBSTITUI os herdados do server,
    # então as 5 cabeçalhos de segurança são re-declarados aqui (senão o CSP
    # não chegaria na própria página do app).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $ci_csp always;
    }

    # ── Prospecção (PRIVADO — só o operador, via Basic Auth). NÃO faz parte do app
    # mostrado ao cliente. `^~` é obrigatório: sem ele o regex \.html$ acima capturaria
    # o mapa/guia e aplicaria a CSP estrita (que bloqueia o Leaflet do unpkg).
    location ^~ /prospec/ {
        alias /var/www/prospec/;
        autoindex off;
        index dashboard.html;
        auth_basic "Prospeccao (restrito)";
        auth_basic_user_file /etc/nginx/.htpasswd_prospec;
        # scripts e banco de leads NUNCA são servidos (nem autenticado)
        location ~* \.(py|db|log|md)$ { deny all; }
        # CSP relaxada só aqui: libera Leaflet (unpkg) + tiles OpenStreetMap
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self';" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # /prospec sem barra → manda pra versão com barra (senão cai no app público)
    location = /prospec { return 301 /prospec/; }
}
