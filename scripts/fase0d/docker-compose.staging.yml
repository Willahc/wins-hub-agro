# Staging exclusive Docker Compose file for Phase 0D
version: '3.8'

services:
  staging_db:
    image: postgres:16-alpine
    container_name: wins_agro_fase0d_db
    environment:
      POSTGRES_DB: fase0d_staging
      POSTGRES_USER: fase0_test
      POSTGRES_PASSWORD: staging_password_synthetic
    mem_limit: 768m
    cpus: 1.0
    networks:
      - staging_backend
    volumes:
      - staging_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fase0_test -d fase0d_staging || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    labels:
      com.winshub.environment: "fase0d-staging"
      com.winshub.service: "database"

  staging_api:
    build:
      context: ../../app
      dockerfile: Dockerfile
    image: wins_agro_fase0d_api:staging
    container_name: wins_agro_fase0d_api
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      staging_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8000"
    networks:
      - staging_backend
    environment:
      # Injetados de forma estática ou via env_file de staging
      DB_HOST: staging_db
      DB_PORT: 5432
      POSTGRES_DB: fase0d_staging
      DB_USER: wins_agro_app
      DB_PASSWORD: app_synthetic_pass
      SECRET_KEY: staging_jwt_secret_synthetic_64_characters_long_for_security_reasons
      ENABLE_MULTI_TENANCY_FOUNDATION: "true"
      ENABLE_FARMS_V2: "true"
      ENABLE_FOOD_AUTONOMY: "true"
      ENABLE_PASTURE_LIVE: "true"
      ENABLE_FEED_INVENTORY: "true"
      ENABLE_HARVEST_SILOS: "true"
      ENABLE_WEATHER_OPERATIONS: "true"
      WEATHER_PROVIDER: "open-meteo"
      WEATHER_TIMEOUT_SECONDS: "10"
      MARI_EMAIL: "mari@winshubagro.cloud"
      MARI_PASSWORD_HASH: "$$2b$$12$$vT2i6.VrwPS/.GDuQgKXKeXAIJxXaOgF0hSL36AcbxUe2dyH5AOWC"
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=3).getcode()==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      org.opencontainers.image.revision: "fase0d"
      org.opencontainers.image.created: "2026-07-13T15:56:18Z"
      com.winshub.environment: "fase0d-staging"
      com.winshub.service: "api"

networks:
  staging_backend:
    name: wins_agro_fase0d_backend
    labels:
      com.winshub.environment: "fase0d-staging"

volumes:
  staging_db_data:
    name: wins_agro_fase0d_db_data
    labels:
      com.winshub.environment: "fase0d-staging"
